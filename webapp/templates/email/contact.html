<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>New contact message – {{site_name}}</title>
</head>
<body style="margin:0;padding:24px 12px;background:#0b1220;font-family:Arial,Helvetica,sans-serif;color:#e6edf7;">
  <div style="max-width:600px;margin:0 auto;background:#111a2e;border:1px solid #22304d;border-radius:8px;padding:24px 28px;">
    <div style="font-size:13px;letter-spacing:1px;color:#7f93b8;text-transform:uppercase;">{{site_name}} · contact form</div>
    <h1 style="font-size:20px;margin:10px 0 16px;color:#ffffff;">New message from {{name}}</h1>
    <table role="presentation" cellpadding="0" cellspacing="0" style="font-size:14px;line-height:1.6;color:#c9d4e8;margin-bottom:14px;">
      <tr><td style="padding-right:14px;color:#7f93b8;">Name / nickname</td><td><strong>{{name}}</strong></td></tr>
      <tr><td style="padding-right:14px;color:#7f93b8;">Email</td><td><a href="mailto:{{email}}" style="color:#7fb2ff;">{{email}}</a></td></tr>
      <tr><td style="padding-right:14px;color:#7f93b8;">Language</td><td>{{lang}}</td></tr>
      <tr><td style="padding-right:14px;color:#7f93b8;">Sent</td><td>{{date}}</td></tr>
    </table>
    <div style="white-space:pre-wrap;font-size:15px;line-height:1.6;color:#e6edf7;background:#0b1220;border:1px solid #22304d;border-radius:6px;padding:14px 16px;">{{message}}</div>
    <p style="font-size:12px;color:#7f93b8;margin:16px 0 0;">Reply to this email to answer: the Reply-To address is the sender's. The sender accepted the privacy policy.</p>
  </div>
</body>
</html>
