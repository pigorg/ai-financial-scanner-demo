name: Aggiorna dati scanner

on:
  schedule:
    # 21:30 UTC, lun-ven: dopo la chiusura dei mercati USA (23:30 ora legale / 22:30 ora solare a Roma)
    - cron: "30 21 * * 1-5"
  workflow_dispatch:   # avvio manuale dal tab "Actions"

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: webapp/scripts/requirements.txt

      - run: pip install -r webapp/scripts/requirements.txt

      # I bilanci cambiano di rado: la cache evita di rileggerli ogni sera.
      - uses: actions/cache@v4
        with:
          path: webapp/scripts/fund_cache.json
          key: fund-cache-${{ github.run_id }}
          restore-keys: fund-cache-

      - name: Genera data.json e hist/
        run: python webapp/scripts/update_data.py

      - name: Carica sul sito via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ${{ secrets.FTP_PROTOCOL || 'ftps' }}
          local-dir: webapp/public_html/
          server-dir: ${{ secrets.FTP_DIR }}
